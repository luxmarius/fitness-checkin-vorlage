<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a8163">
  <meta name="description" content="Deine Fitness-Check-in-Ansicht mit laufender Zeit.">
  <title>Fitness Check-in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a8163'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2' stroke-dasharray='5 3 1 3'/%3E%3Cpath d='m11 16 3 3 7-7' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="screen" aria-label="Fitness Check-in">
    <div class="header" aria-hidden="true">
      <img class="original-header" src="./assets/reference.jpg" alt="">
      <div class="erase-old-ring"></div>
    </div>

    <time class="status-time" id="status-time" aria-label="Aktuelle Uhrzeit">--:--</time>
    <button class="toolbar-button close-button" id="close" aria-label="Ansicht schließen"></button>
    <button class="toolbar-button share-button" id="share" aria-label="Ansicht teilen"></button>

    <div class="avatar-frame">
      <div class="portrait">
        <img src="./assets/reference.jpg" alt="Profilfoto von Johannes Rumpfinger">
      </div>
    </div>
    <svg class="orbit" viewBox="0 0 410 410" aria-hidden="true">
      <circle cx="205" cy="205" r="195" pathLength="1200" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="42 22 2 22 2 22" />
    </svg>

    <section class="details" aria-labelledby="member-name">
      <header class="member">
        <h1 id="member-name">Johannes Rumpfinger · 687860645</h1>
        <p class="checkin">Check-in: <time id="checkin-time">—</time><span class="separator">·</span><span id="duration" role="timer" aria-label="Dauer seit Check-in">0 : 00 : 00</span></p>
      </header>
      <dl class="facts">
        <div class="fact">
          <dt><svg viewBox="0 0 44 52" aria-hidden="true"><path d="M22 3C10 3 2 12 2 23c0 14 20 28 20 28s20-14 20-28C42 12 34 3 22 3Zm0 26a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>Standort</dt>
          <dd>Fitness First München - DER Bogen</dd>
        </div>
        <div class="fact">
          <dt><svg class="bottle" viewBox="0 0 44 58" aria-hidden="true"><g transform="rotate(-12 22 29)"><rect x="15" y="1" width="14" height="9" rx="4"/><path d="M13 8h18l5 10v32a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V18Z"/><path d="M18 26h18M18 39h18" stroke="#fdfdfd" stroke-width="4"/></g></svg>Aktivität</dt>
          <dd>Fitness</dd>
        </div>
        <div class="fact">
          <dt><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M28 2h11l5 5v13a6 6 0 0 1-2 4L22 44a6 6 0 0 1-8 0L2 32a6 6 0 0 1 0-8L24 4a6 6 0 0 1 4-2Zm5 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>Kategorie</dt>
          <dd>Fitness</dd>
        </div>
      </dl>
    </section>
  </main>
  <div class="toast" role="status" id="toast" hidden></div>
</body>
</html>
